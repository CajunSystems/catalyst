name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build & test (JDK 21)
    runs-on: ubuntu-latest
    env:
      GUMBO_VERSION: "0.7.0"
    steps:
      - name: Checkout Catalyst
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Catalyst depends on com.cajunsystems:gumbo. The intended source is JitPack, but to keep CI
      # deterministic (and independent of JitPack availability / egress policy) we build the pinned
      # Gumbo release tag and install it into the local Maven repo before building Catalyst.
      - name: Install Gumbo ${{ env.GUMBO_VERSION }} into local Maven repo
        run: |
          set -euo pipefail
          if [ -d "$HOME/.m2/repository/com/cajunsystems/gumbo/${GUMBO_VERSION}" ]; then
            echo "Gumbo ${GUMBO_VERSION} already cached in ~/.m2 — skipping build."
          else
            git clone --depth 1 --branch "${GUMBO_VERSION}" https://github.com/CajunSystems/gumbo.git /tmp/gumbo
            mvn -B --no-transfer-progress -f /tmp/gumbo/pom.xml install -DskipTests
          fi

      - name: Build and test
        run: mvn -B --no-transfer-progress install

      # The literal M0 exit criterion (spec §11): kill -9 mid-task across two separate JVMs, resume,
      # finish with zero duplicate model calls. CI is the source of truth that each phase still holds.
      - name: M0 exit demo (kill -9 → resume across two processes)
        run: |
          set -uo pipefail
          mvn -B --no-transfer-progress -q -pl catalyst-api \
            org.apache.maven.plugins:maven-dependency-plugin:3.6.1:build-classpath \
            -Dmdep.outputFile=target/cp.txt
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"
          DIR="$(mktemp -d)"

          echo "--- process 1: record then kill -9 (exit 137) ---"
          rc=0
          java -cp "$CP" com.cajunsystems.catalyst.api.Demo "$DIR" record || rc=$?
          echo "record exit code: $rc"
          if [ "$rc" -ne 137 ]; then echo "FAIL: record did not simulate kill -9 (exit $rc)"; exit 1; fi

          echo "--- process 2: resume ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo "$DIR" resume)"
          echo "$OUT"
          echo "$OUT" | grep -q "result: SUMMARY|FINAL" \
            || { echo "FAIL: unexpected result (resume did not complete correctly)"; exit 1; }
          echo "$OUT" | grep -q "model calls THIS run: 1" \
            || { echo "FAIL: resume made a duplicate model call"; exit 1; }
          echo "M0 exit criterion holds: resumed with zero duplicate model calls."

      # The M1 exit criterion (spec §11): replay a recorded execution with substitution and zero
      # external calls, verify canonical hashes, and detect a divergent replay.
      - name: M1 exit demo (strict replay with zero external calls)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- replay a recorded execution ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo replay)"
          echo "$OUT"
          echo "$OUT" | grep -q "external calls during replay: 0" \
            || { echo "FAIL: replay made external calls"; exit 1; }
          echo "$OUT" | grep -q "divergence correctly detected" \
            || { echo "FAIL: nondeterministic replay was not detected"; exit 1; }
          echo "M1 exit criterion holds: exact replay, zero external calls, divergence detected."

      # The M2 exit criterion (spec §11): rerun a recorded execution with a different model from
      # step N and print the step-by-step diff.
      - name: M2 exit demo (branch with a different model + diff)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- branch a recorded execution with a swapped model ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo branch)"
          echo "$OUT"
          echo "$OUT" | grep -q "1 step(s) changed" \
            || { echo "FAIL: branch diff did not report the expected change"; exit 1; }
          echo "$OUT" | grep -q "MODEL  CHANGED" \
            || { echo "FAIL: branch diff did not mark the model step changed"; exit 1; }
          echo "M2 exit criterion holds: branch with a swapped model produced a step-by-step diff."

      # The v0.2 durability exit criterion (roadmap — Snapshots): a long execution is checkpointed so
      # inspect/resume folds from the snapshot forward instead of re-folding the whole log, and the
      # snapshot fold matches a full re-fold exactly.
      - name: v0.2 Snapshot exit demo (fold from a checkpoint, not the whole log)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- fold a long execution from a snapshot ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo snapshot)"
          echo "$OUT"
          echo "$OUT" | grep -q "snapshot fold matches full fold: true" \
            || { echo "FAIL: snapshot fold diverged from a full re-fold"; exit 1; }
          COLD="$(echo "$OUT" | sed -n 's/.*cold inspect folded \([0-9]*\) events.*/\1/p')"
          WARM="$(echo "$OUT" | sed -n 's/.*warm inspect folded \([0-9]*\) events.*/\1/p')"
          [ -n "$COLD" ] && [ -n "$WARM" ] && [ "$WARM" -lt "$COLD" ] \
            || { echo "FAIL: warm inspect did not fold fewer events than cold ($WARM vs $COLD)"; exit 1; }
          echo "v0.2 Snapshot exit criterion holds: warm fold read $WARM events vs $COLD cold, results identical."

      # The v0.2 cancellation exit criterion (roadmap increment ①): a running task is cancelled
      # cooperatively, folds to CANCELLED (not FAILED), and the post-cancel boundary never runs.
      - name: v0.2 Cancellation exit demo (cooperative cancel folds to CANCELLED)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- cancel a running execution cooperatively ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo cancel)"
          echo "$OUT"
          echo "$OUT" | grep -q -- "-> CANCELLED" \
            || { echo "FAIL: cancelled execution did not fold to CANCELLED"; exit 1; }
          echo "$OUT" | grep -q "model calls before cancel: 1" \
            || { echo "FAIL: the post-cancel boundary executed (or the pre-cancel one did not)"; exit 1; }
          echo "v0.2 Cancellation exit criterion holds: cooperative cancel folded to CANCELLED, no wasted call."

      # The v0.2 retry exit criterion (roadmap §13.3): a transient tool failure is retried as a new
      # attempt on the same stream — the failing boundary re-runs live while the successful prefix is
      # substituted — bounded by the policy, and the retried log still replays exactly. The pair
      # "tool invocations: 3" + "model calls across retries: 1" is the whole semantics: substitute-
      # everything would show 1 invocation + FAILED, re-run-everything would show 3 model calls.
      # The durable timer exit criterion: a sleep survives its runtime shutting down, the next runtime's
      # startup recovery wakes it when due (never early), no model call repeats, and it replays exactly.
      - name: Durable timer exit demo (sleep → restart → wake on time; exact replay)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo timer)" || { echo "$OUT"; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -q "\[timer\] model calls: before the sleep 1, after the wake 1" || { echo "FAIL: a model call repeated"; exit 1; }
          echo "$OUT" | grep -q "\[timer\] calls during a strict replay: 0" || { echo "FAIL: replay made calls"; exit 1; }
          echo "$OUT" | grep -q "Durable timer exit criterion holds" || exit 1

      # The child execution exit criterion: a coordinator delegates to two child executions, each its
      # own durable stream; the runtime shuts down mid-way, the next one finishes the child, which
      # wakes the coordinator, no model call repeats, and the coordinator replays exactly.
      - name: Child execution exit demo (delegate → restart → child wakes parent; exact replay)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo child)" || { echo "$OUT"; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -q "\[child\] model calls: before the restart 1, after 1" || { echo "FAIL: a model call repeated"; exit 1; }
          echo "$OUT" | grep -q "\[child\] calls during a strict replay of the coordinator: 0" || { echo "FAIL: replay made calls"; exit 1; }
          echo "$OUT" | grep -q "Child execution exit criterion holds" || exit 1

      # The agent exit criterion: a tool-calling agent behaves as any execution does. It resumes
      # mid-conversation without repeating a model turn or a tool call, replays with zero calls, and
      # is evaluated without re-running a tool.
      - name: Agent exit demo (crash mid-conversation → resume; exact replay; eval with no tool re-run)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo agent)" || { echo "$OUT"; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -q "\[agent\] model turns on resume: 2 " || { echo "FAIL: resume repeated a model turn"; exit 1; }
          echo "$OUT" | grep -q "\[agent\] tool executions in total: lookup 1, page 1" || { echo "FAIL: a tool call was repeated"; exit 1; }
          echo "$OUT" | grep -q "\[agent\] calls during a strict replay of the whole conversation: 0" || { echo "FAIL: replay made calls"; exit 1; }
          echo "$OUT" | grep -q "\[agent\] tool executions during the evaluation: 0" || { echo "FAIL: eval re-ran a tool"; exit 1; }
          echo "$OUT" | grep -q "Agent exit criterion holds" || exit 1

      # The eval harness exit criterion: recorded runs replayed against candidate models and a prompt
      # rewrite and scored, without re-running a single tool or calling the recorded model.
      - name: Eval harness exit demo (candidates scored against recorded runs; no tool re-run)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo eval)" || { echo "$OUT"; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -q "candidate same-model: 3/3 passed all scorers" || { echo "FAIL: identical candidate did not pass"; exit 1; }
          echo "$OUT" | grep -q "candidate concise-model: 0/3 passed all scorers" || { echo "FAIL: a differing candidate was not caught"; exit 1; }
          echo "$OUT" | grep -q "\[eval\] tool executions during the evaluation: 0" || { echo "FAIL: the evaluation re-ran a tool"; exit 1; }
          echo "$OUT" | grep -q "\[eval\] calls to the recorded production model during the evaluation: 0" || exit 1
          echo "$OUT" | grep -q "Eval harness exit criterion holds" || exit 1

      - name: v0.2 Retry exit demo (bounded retry-as-attempt, prefix substituted, replay exact)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- retry a transient tool failure ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo retry)"
          echo "$OUT"
          echo "$OUT" | grep -q "\[retry\] transient tool failure retried -> COMPLETED" \
            || { echo "FAIL: a retryable failure did not recover"; exit 1; }
          echo "$OUT" | grep -q "\[retry\] tool invocations: 3" \
            || { echo "FAIL: the failing tool was not re-run live (recorded failure substituted?)"; exit 1; }
          echo "$OUT" | grep -q "\[retry\] model calls across retries: 1" \
            || { echo "FAIL: retry re-ran the successful prefix"; exit 1; }
          echo "$OUT" | grep -q "\[retry\] external calls during replay of the retried execution: 0" \
            || { echo "FAIL: a retried execution no longer replays exactly"; exit 1; }
          echo "$OUT" | grep -q "\[retry\] default policy (none) -> FAILED" \
            || { echo "FAIL: retry is not opt-in (default policy retried)"; exit 1; }
          echo "$OUT" | grep -q "\[retry\] retry criterion holds" \
            || { echo "FAIL: retry demo did not pass its assertions"; exit 1; }
          echo "v0.2 Retry exit criterion holds: bounded retry-as-attempt, prefix substituted, replay exact."

      # The v0.2 observability exit criterion (spec §12): an execution's event log folds into one
      # OpenTelemetry trace — a root span for the run, a child span per boundary (model/tool), and
      # lifecycle moments (a retry here) as annotations on the root. Exported through a real OTel SDK
      # into an in-process exporter, fully offline. "model spans: 1" + "tool spans: 2" proves semantic
      # spans; "root spans (traces): 1" proves one trace per execution.
      - name: v0.2 OTel exit demo (execution log folds into an OpenTelemetry trace)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- fold an execution into an OpenTelemetry trace ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo otel)"
          echo "$OUT"
          echo "$OUT" | grep -q "\[otel\] root spans (traces): 1" \
            || { echo "FAIL: an execution did not fold into exactly one trace"; exit 1; }
          echo "$OUT" | grep -q "\[otel\] model spans: 1" \
            || { echo "FAIL: the model boundary did not become a span"; exit 1; }
          echo "$OUT" | grep -q "\[otel\] tool spans: 2" \
            || { echo "FAIL: the tool boundaries did not become spans"; exit 1; }
          echo "$OUT" | grep -q "\[otel\] retry annotation on root: true" \
            || { echo "FAIL: the retry was not annotated on the root span"; exit 1; }
          echo "$OUT" | grep -q "\[otel\] otel criterion holds" \
            || { echo "FAIL: otel demo did not pass its assertions"; exit 1; }
          echo "v0.2 OTel exit criterion holds: execution folded into one trace with semantic spans."

      # The v0.2 resume-by-id exit criterion (roadmap increment ②): recover a crashed execution from
      # its id alone via the task registry — no idempotency key, no re-submitted task — finishing with
      # zero duplicate model calls.
      - name: v0.2 Resume-by-id exit demo (standalone resume(id) via the task registry)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- resume a crashed execution from its id alone ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo resumeid)"
          echo "$OUT"
          echo "$OUT" | grep -q "result: SUMMARY|FINAL" \
            || { echo "FAIL: resume(id) did not complete correctly"; exit 1; }
          echo "$OUT" | grep -q "model calls THIS run: 2" \
            || { echo "FAIL: resume(id) made a duplicate model call"; exit 1; }
          echo "v0.2 Resume-by-id exit criterion holds: recovered from the id alone, zero duplicate calls."

      # The Deploy-2 exit criterion: a node dies (kill -9) with several executions in flight and one
      # paused; a fresh process built with recoverOnStart finds them through the execution index alone,
      # finishes the in-flight ones with zero duplicate model calls, and leaves the paused one paused.
      - name: Deploy-2 startup recovery exit demo (kill -9 with work in flight → recoverOnStart)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"
          DIR="$(mktemp -d)"

          echo "--- process 1: record several executions mid-flight, then kill -9 (exit 137) ---"
          rc=0
          java -cp "$CP" com.cajunsystems.catalyst.api.Demo "$DIR" crashmany || rc=$?
          if [ "$rc" -ne 137 ]; then echo "FAIL: crashmany did not simulate kill -9 (exit $rc)"; exit 1; fi

          echo "--- process 2: restart with recoverOnStart ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo "$DIR" recover)"
          echo "$OUT"
          echo "$OUT" | grep -q "resumed: 4, left alone: 2, not recovered: 1" \
            || { echo "FAIL: recovery did not resume exactly the crash-interrupted executions"; exit 1; }
          echo "$OUT" | grep -q "model calls THIS run: 4" \
            || { echo "FAIL: recovery made duplicate model calls"; exit 1; }
          echo "$OUT" | grep -q "(WAITING) -> still WAITING" \
            || { echo "FAIL: recovery resumed an execution that is waiting for a signal"; exit 1; }
          echo "$OUT" | grep -q "(PAUSED) -> still PAUSED" \
            || { echo "FAIL: recovery un-paused a paused execution"; exit 1; }
          echo "Deploy-2 exit criterion holds: in-flight work recovered, paused work left alone."

      # The Deploy-4 exit criterion: closing a runtime mid-run abandons the execution instead of failing
      # it, releases the log, and a restart resumes it with zero duplicate model calls.
      - name: Deploy-4 graceful shutdown exit demo (close mid-run → restart → resume)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo shutdown)"
          echo "$OUT"
          echo "$OUT" | grep -q "attempt abandoned" \
            || { echo "FAIL: shutdown did not abandon the running attempt"; exit 1; }
          echo "$OUT" | grep -q "COMPLETED result: SUMMARY|FINAL" \
            || { echo "FAIL: the restart did not resume the abandoned execution"; exit 1; }
          echo "$OUT" | grep -q "model calls THIS run: 1" \
            || { echo "FAIL: the restart made duplicate model calls"; exit 1; }
          echo "Deploy-4 exit criterion holds: abandoned on shutdown, resumed on restart."

      # The Deploy-6 exit criterion: a task waits for a human's signal with no thread held, survives a
      # restart while waiting, and a signal resumes it with zero duplicate model calls.
      - name: Deploy-6 signals exit demo (await → restart → signal → resume)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo signal)"
          echo "$OUT"
          echo "$OUT" | grep -q "after restart: WAITING, awaiting approval" \
            || { echo "FAIL: the execution was not waiting for its signal across a restart"; exit 1; }
          echo "$OUT" | grep -q "COMPLETED result: SUMMARY|FINAL (approved by dana)" \
            || { echo "FAIL: the signal did not resume the execution with its payload"; exit 1; }
          echo "$OUT" | grep -q "model calls THIS run: 1" \
            || { echo "FAIL: resuming after the signal made duplicate model calls"; exit 1; }
          echo "Deploy-6 exit criterion holds: waited, survived a restart, resumed by a signal."

      # The v0.2 built-in-tools exit criterion (roadmap increment ③): a task's HTTP + Filesystem calls
      # are recorded boundaries — a strict replay substitutes them, re-issuing no request and
      # re-applying no write.
      - name: v0.2 Built-in tools exit demo (HTTP + Filesystem recorded & substituted on replay)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- record then replay an HTTP fetch + filesystem write ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo tools)"
          echo "$OUT"
          echo "$OUT" | grep -q "HTTP calls during replay: 0" \
            || { echo "FAIL: replay re-issued the HTTP request"; exit 1; }
          echo "$OUT" | grep -q "file write re-applied on replay: false" \
            || { echo "FAIL: replay re-applied the file write"; exit 1; }
          echo "v0.2 Built-in-tools exit criterion holds: HTTP + Filesystem calls substituted on replay."

      # The v0.2 generic-collection payloads exit criterion (roadmap increment ④): a List/Map of records
      # round-trips through the log with element-type fidelity and is substituted on replay.
      - name: v0.2 Collection payloads exit demo (List<record> round-trips with element-type fidelity)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- record then replay a task capturing a List<record> ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo collections)"
          echo "$OUT"
          echo "$OUT" | grep -q "total 5" \
            || { echo "FAIL: collection task did not compute the expected total"; exit 1; }
          echo "$OUT" | grep -q "supplier calls during replay: 0" \
            || { echo "FAIL: replay re-ran the effect supplier (collection not substituted)"; exit 1; }
          echo "v0.2 Collection-payloads exit criterion holds: List<record> round-trips and substitutes on replay."

      # The v0.2 blob-store exit criterion (roadmap increment ⑤): a payload over the 64 KiB threshold is
      # stored out-of-line in a content-addressed blob store, not inlined in the event stream, and
      # rehydrated transparently on replay.
      - name: v0.2 Blob store exit demo (large payload stored out-of-line, rehydrated on replay)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- record then replay a task with a >64 KiB payload ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo blob)"
          echo "$OUT"
          echo "$OUT" | grep -q "big payload inlined in the event log: false" \
            || { echo "FAIL: large payload was inlined in the event log"; exit 1; }
          echo "$OUT" | grep -q "blob-store criterion holds" \
            || { echo "FAIL: blob-store demo did not pass its assertions"; exit 1; }
          echo "v0.2 Blob-store exit criterion holds: large payload stored out-of-line and rehydrated on replay."

      # The v0.2 schema-evolution exit criterion (spec §13.4): a log recorded under an older schema
      # (renamed event type + field, plus an unknown field) reads and folds under the current schema
      # via the tolerant reader + upcasters.
      - name: v0.2 Schema evolution exit demo (legacy-schema log reads under the current schema)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- decode and fold a legacy-schema log ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo schema)"
          echo "$OUT"
          echo "$OUT" | grep -q "folded status: COMPLETED; result: 42" \
            || { echo "FAIL: legacy-schema log did not fold to the expected state"; exit 1; }
          echo "$OUT" | grep -q "schema-evolution criterion holds" \
            || { echo "FAIL: schema-evolution demo did not pass its assertions"; exit 1; }
          echo "v0.2 Schema-evolution exit criterion holds: legacy-schema log reads under the current schema."

      # The v0.2 auto-capture exit criterion (spec §6): a task containing plain Instant.now() /
      # UUID.randomUUID() / Random calls and NO ctx.effect is recorded and replayed exactly, because the
      # agent rewrote those call sites into recorded boundaries. The uninstrumented control run is half
      # the criterion: without capture the replay raises nothing and silently recomputes different
      # values, so "replay threw nothing" alone would prove nothing.
      - name: v0.2 Auto-capture exit demo (unwrapped nondeterminism recorded and substituted)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- record then replay a task with no ctx.effect in it ---"
          OUT="$(java -XX:+EnableDynamicAgentLoading -cp "$CP" com.cajunsystems.catalyst.api.Demo autocapture)"
          echo "$OUT"
          echo "$OUT" | grep -q "\[autocapture\] without the agent - replay recomputed a different value: true" \
            || { echo "FAIL: the uninstrumented control run was not nondeterministic"; exit 1; }
          echo "$OUT" | grep -q "\[autocapture\] auto-captured boundaries: \[auto:Instant.now#0, auto:UUID.randomUUID#1, auto:Random.nextInt#2\]" \
            || { echo "FAIL: the agent did not capture the expected boundaries"; exit 1; }
          echo "$OUT" | grep -q "replay recomputed the recorded value exactly: true" \
            || { echo "FAIL: replay did not reproduce the recorded values"; exit 1; }
          echo "$OUT" | grep -q "\[autocapture\] autocapture criterion holds" \
            || { echo "FAIL: autocapture demo did not pass its assertions"; exit 1; }
          echo "v0.2 Auto-capture exit criterion holds: unwrapped nondeterminism recorded and substituted."

      # The v0.2 streaming exit criterion (spec §13.1): a task consumes a completion incrementally and
      # the execution still replays exactly. The point is that streaming changed nothing about
      # durability — "CompletionReceived" appears exactly once, the same event a non-streaming call
      # writes — so "chunks during record" > 1 alongside "model calls during replay: 0" is the whole
      # semantics: real incremental delivery live, full substitution on replay.
      - name: v0.2 Streaming exit demo (incremental delivery, one recorded completion, exact replay)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- stream a completion, then replay it ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo streaming)"
          echo "$OUT"
          CHUNKS="$(echo "$OUT" | sed -n 's/.*\[streaming\] chunks during record: \([0-9]*\).*/\1/p')"
          [ -n "$CHUNKS" ] && [ "$CHUNKS" -gt 1 ] \
            || { echo "FAIL: the live run was not incremental (chunks=$CHUNKS)"; exit 1; }
          echo "$OUT" | grep -q "model calls during replay: 0" \
            || { echo "FAIL: replay contacted the model"; exit 1; }
          echo "$OUT" | grep -q "assembled text identical: true" \
            || { echo "FAIL: replay did not reproduce the streamed text"; exit 1; }
          echo "$OUT" | grep -q "CompletionRequested, CompletionReceived, ExecutionCompleted\]" \
            || { echo "FAIL: a streamed call did not record the same events as a plain one"; exit 1; }
          echo "$OUT" | grep -q "\[streaming\] streaming criterion holds" \
            || { echo "FAIL: streaming demo did not pass its assertions"; exit 1; }
          echo "v0.2 Streaming exit criterion holds: $CHUNKS chunks live, one recorded completion, replay with zero model calls."

      # The v0.2 timeline exit criterion (spec §12): an execution's folded state renders to a read-only
      # HTML report. "self-contained: true" is the load-bearing assertion — a report with no scripts and
      # no external references is one you can attach to a ticket or open from file:// years later.
      # "deterministic: true" pins that it stays a pure fold of the log, not a live view.
      - name: v0.2 Timeline exit demo (folded execution renders to a self-contained HTML report)
        run: |
          set -uo pipefail
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"

          echo "--- render an execution's timeline ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo timeline)"
          echo "$OUT"
          echo "$OUT" | grep -q "self-contained (no scripts, no external refs): true" \
            || { echo "FAIL: the report referenced something external"; exit 1; }
          echo "$OUT" | grep -q "deterministic for a given log: true" \
            || { echo "FAIL: the report is not a pure fold of the log"; exit 1; }
          echo "$OUT" | grep -q "\[timeline\] latency bars drawn: " \
            || { echo "FAIL: no latency bars reported (the demo itself asserts one per step)"; exit 1; }
          echo "$OUT" | grep -q "\[timeline\] branch comparison written: .*(changed steps: 1)" \
            || { echo "FAIL: the branch comparison did not isolate the post-branch step"; exit 1; }
          echo "$OUT" | grep -q "\[timeline\] timeline criterion holds" \
            || { echo "FAIL: timeline demo did not pass its assertions"; exit 1; }
          echo "v0.2 Timeline exit criterion holds: folded execution rendered to a portable HTML report."

      # The -javaagent launch the README documents, exercised the way a user would: the agent jar alone,
      # with NO Byte Buddy on the application classpath (a -javaagent jar does not get its Maven
      # dependencies). This gates two failure modes that are invisible to the in-process tests — an
      # agent jar missing its own dependencies, and a shaded copy of catalyst-core inside it, which
      # would give instrumented code a *different* AutoCapture than the one the runtime binds, silently
      # capturing nothing.
      - name: v0.2 Auto-capture -javaagent packaging (launch-time attach, dependency-free)
        run: |
          set -euo pipefail
          AGENT="$(ls catalyst-agent/target/catalyst-agent-*-javaagent.jar)"
          echo "agent jar: $AGENT"

          if unzip -l "$AGENT" | grep -q "com/cajunsystems/catalyst/capture/"; then
            echo "FAIL: the agent jar bundles catalyst-core's AutoCapture bridge; instrumented code"
            echo "      would target a duplicate class and capture nothing."; exit 1
          fi
          if unzip -l "$AGENT" | grep -qE " net/bytebuddy/"; then
            echo "FAIL: Byte Buddy is not relocated in the agent jar"; exit 1
          fi

          mkdir -p /tmp/agentcheck/src/com/acme/tasks
          cat > /tmp/agentcheck/src/com/acme/tasks/Main.java <<'JAVA'
          package com.acme.tasks;
          import com.cajunsystems.catalyst.Context;
          import com.cajunsystems.catalyst.ExecutionInfo;
          import com.cajunsystems.catalyst.Memory;
          import com.cajunsystems.catalyst.Tool;
          import com.cajunsystems.catalyst.capture.AutoCapture;
          import com.cajunsystems.catalyst.model.Model;
          import org.slf4j.Logger;
          import java.time.Instant;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.UUID;
          import java.util.function.Supplier;
          public class Main {
              static final class Probe implements Context {
                  final List<String> labels = new ArrayList<>();
                  @Override public <T> T effect(String label, Supplier<T> supplier) {
                      labels.add(label); return supplier.get();
                  }
                  @Override public Model model() { throw new UnsupportedOperationException(); }
                  @Override public <I, O> O call(Tool<I, O> t, I i) { throw new UnsupportedOperationException(); }
                  @Override public Memory memory() { throw new UnsupportedOperationException(); }
                  @Override public <T> T var(String n) { return null; }
                  @Override public ExecutionInfo info() { throw new UnsupportedOperationException(); }
                  @Override public Logger log() { throw new UnsupportedOperationException(); }
              }
              static String taskBody() { return Instant.now() + "|" + UUID.randomUUID(); }
              public static void main(String[] args) {
                  Probe probe = new Probe();
                  try (AutoCapture.Scope scope = AutoCapture.bind(probe)) { taskBody(); }
                  System.out.println("CAPTURED_LABELS=" + probe.labels);
              }
          }
          JAVA

          SLF4J="$(ls ~/.m2/repository/org/slf4j/slf4j-api/2.*/slf4j-api-2.*.jar | head -1)"
          APPCP="/tmp/agentcheck/out:catalyst-core/target/classes:catalyst-events/target/classes:$SLF4J"
          javac -cp "$APPCP" -d /tmp/agentcheck/out /tmp/agentcheck/src/com/acme/tasks/Main.java

          OUT="$(java -javaagent:"$AGENT"=packages=com.acme.tasks -cp "$APPCP" com.acme.tasks.Main)"
          echo "$OUT"
          echo "$OUT" | grep -q "CAPTURED_LABELS=\[auto:Instant.now#0, auto:UUID.randomUUID#1\]" \
            || { echo "FAIL: -javaagent launch did not capture through the application's bridge"; exit 1; }
          echo "v0.2 Auto-capture packaging holds: -javaagent works standalone and binds the app's bridge."

  # Dist-0: the multi-writer log, measured. Two logs on one FoundationDB root are two nodes' worth of
  # connections, sequencers and caches; FoundationDBEventLogTest and FoundationDBAcceptanceTest race
  # them. Copied from Gumbo's own `fdb` job (0.7.0): the official image as a service container in host
  # networking mode, the client package on the runner, `configure new single memory`, then the tests.
  # CATALYST_REQUIRE_FDB makes an unreachable cluster a failure, not a skip — and the last step fails if
  # any FoundationDB class still reports one, since a skipped suite reads exactly like a passing one.
  fdb:
    name: FoundationDB (multi-writer log)
    runs-on: ubuntu-latest
    env:
      FDB_VERSION: "7.3.43"   # matches fdb.version in the root pom; the image tag and client package follow it
    services:
      foundationdb:
        image: foundationdb/foundationdb:7.3.43
        env:
          # Advertise 127.0.0.1, not the container's own address: the client is on the runner.
          FDB_NETWORKING_MODE: host
        ports:
          - 4500:4500
    steps:
      - name: Checkout Catalyst
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install the FoundationDB client library
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb" \
            -o "$RUNNER_TEMP/fdb-clients.deb"
          sudo dpkg -i "$RUNNER_TEMP/fdb-clients.deb"

      # The image starts fdbserver but does not create a database; that is a one-off fdbcli call,
      # retried while the server comes up.
      - name: Create the database
        run: |
          set -euo pipefail
          echo "docker:docker@127.0.0.1:4500" > "$RUNNER_TEMP/fdb.cluster"
          echo "FDB_CLUSTER_FILE=$RUNNER_TEMP/fdb.cluster" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if fdbcli -C "$RUNNER_TEMP/fdb.cluster" --exec 'configure new single memory' --timeout 5 | grep -q 'Database created'; then
              break
            fi
            sleep 2
          done
          for _ in $(seq 1 30); do
            if fdbcli -C "$RUNNER_TEMP/fdb.cluster" --exec 'status minimal' --timeout 5 | grep -q 'The database is available'; then
              exit 0
            fi
            sleep 2
          done
          echo "FoundationDB did not become available"; exit 1

      - name: Run the FoundationDB tests
        env:
          CATALYST_REQUIRE_FDB: "true"
        run: >-
          mvn -B --no-transfer-progress -pl catalyst-gumbo,catalyst-api -am
          -Dtest='FoundationDB*Test' -Dsurefire.failIfNoSpecifiedTests=false test

      # The Dist-4 exit criterion, across two JVMs on one FoundationDB root: node A records step 1 and
      # is killed (exit 137); in a second process node B's claim loop takes the job over once A's lease
      # lapses, with zero duplicate model calls; a stalled node's late write is refused after a takeover;
      # and a cancel issued on one node lands through the node running the execution.
      - name: Dist-4 exit demo (kill a node → another takes over; zombie fenced; cross-node cancel)
        run: |
          set -uo pipefail
          mvn -B --no-transfer-progress -q -pl catalyst-api -am install -DskipTests
          mvn -B --no-transfer-progress -q -pl catalyst-api \
            org.apache.maven.plugins:maven-dependency-plugin:3.6.1:build-classpath \
            -Dmdep.outputFile=target/cp.txt
          CP="catalyst-api/target/classes:$(cat catalyst-api/target/cp.txt)"
          ROOT="catalyst-demo-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "--- process 1: node A ---"
          rc=0
          java -cp "$CP" com.cajunsystems.catalyst.api.Demo "$ROOT" distributed-a || rc=$?
          if [ "$rc" -ne 137 ]; then echo "FAIL: node A did not simulate kill -9 (exit $rc)"; exit 1; fi
          echo "--- process 2: the rest of the cluster ---"
          OUT="$(java -cp "$CP" com.cajunsystems.catalyst.api.Demo "$ROOT" distributed-b)" || { echo "$OUT"; exit 1; }
          echo "$OUT"
          echo "$OUT" | grep -q "model calls on node-b: 1 " || { echo "FAIL: the takeover repeated a model call"; exit 1; }
          echo "$OUT" | grep -q "its late write was refused" || { echo "FAIL: the zombie's write was not refused"; exit 1; }
          echo "$OUT" | grep -q "cancel from node-b landed via node-x: CANCELLED" || { echo "FAIL: cross-node cancel"; exit 1; }
          echo "$OUT" | grep -q "Dist-4 exit criterion holds" || exit 1

      - name: Confirm nothing was skipped
        run: |
          set -euo pipefail
          REPORTS=$(ls */target/surefire-reports/*FoundationDB*.txt)
          grep -h "Tests run" $REPORTS
          [ "$(echo "$REPORTS" | wc -l)" -ge 2 ] || { echo "Expected both FoundationDB test classes to run"; exit 1; }
          if grep -h "Tests run" $REPORTS | grep -qv "Skipped: 0"; then
            echo "A FoundationDB test class was skipped"; exit 1
          fi
